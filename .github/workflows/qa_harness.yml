name: LocusQ QA Harness

on:
  workflow_dispatch:
  pull_request:
    # Default types (opened/synchronize/reopened) plus labeled/unlabeled, so
    # applying the needs-reliability-gate label to an existing PR (with no
    # new commit) still triggers a run that can pick it up.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [ main ]

concurrency:
  group: locusq-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rt-safety-audit:
    name: RT Safety Static Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure ripgrep is available
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already installed: $(rg --version | head -n 1)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run HX-06 RT-safety audit
        run: |
          set -euo pipefail
          mkdir -p qa_output/rt_safety
          chmod +x ./scripts/rt-safety-audit.sh

          set +e
          ./scripts/rt-safety-audit.sh --print-summary --output qa_output/rt_safety/baseline_report.tsv > qa_output/rt_safety/baseline_report.stdout.tsv
          audit_code=$?
          set -e

          lane_result="FAIL"
          if [[ "${audit_code}" -eq 0 ]]; then
            lane_result="PASS"
          fi

          printf "lane\tresult\ttimestamp_utc\n" > qa_output/rt_safety/status.tsv
          printf "HX-06-script\t%s\t%s\n" "${lane_result}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> qa_output/rt_safety/status.tsv

          if [[ "${audit_code}" -ne 0 ]]; then
            echo "RT-safety audit reported non-allowlisted findings." >&2
            exit "${audit_code}"
          fi

      - name: Upload RT-safety audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-rt-safety-audit
          path: qa_output/rt_safety/
          retention-days: 14

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether code paths changed
        id: diff
        run: |
          set -euo pipefail

          BASE_SHA=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
          fi

          # Debug: show what GitHub Actions provided
          echo "Event: ${GITHUB_EVENT_NAME}, Base SHA: ${BASE_SHA}"

          # No usable base (workflow_dispatch, brand-new branch, first push):
          # can't compute a diff, so don't risk under-running - treat as changed.
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "${BASE_SHA}" 2>/dev/null; then
            echo "No usable base SHA for diffing - treating as code-changed."
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "Changed files vs ${BASE_SHA}:"
          echo "${CHANGED_FILES}"
          echo "---"

          # Paths that can affect a compiled build or the QA harness itself.
          # Anything else (Documentation/, .codex/, .claude/, TestEvidence/,
          # Design/, root markdown, etc.) skips the macOS build/format jobs.
          CODE_CHANGED="false"

          # Check for code-affecting paths using multiple conditions for robustness
          if echo "${CHANGED_FILES}" | grep -qE '^Source/'; then
            CODE_CHANGED="true"
          elif echo "${CHANGED_FILES}" | grep -qE '^CMakeLists\.txt$'; then
            CODE_CHANGED="true"
          elif echo "${CHANGED_FILES}" | grep -qE '^qa/'; then
            CODE_CHANGED="true"
          elif echo "${CHANGED_FILES}" | grep -qE '^third_party/'; then
            CODE_CHANGED="true"
          elif echo "${CHANGED_FILES}" | grep -qE '^scripts/rt-safety-audit\.sh$'; then
            CODE_CHANGED="true"
          elif echo "${CHANGED_FILES}" | grep -qE '^scripts/rt-safety-allowlist\.txt$'; then
            CODE_CHANGED="true"
          elif echo "${CHANGED_FILES}" | grep -qE '^\.github/workflows/qa_harness\.yml$'; then
            CODE_CHANGED="true"
          fi

          echo "Code changed result: ${CODE_CHANGED}"
          echo "code_changed=${CODE_CHANGED}" >> "${GITHUB_OUTPUT}"

  qa-format-clap:
    name: QA Format CLAP (macOS)
    runs-on: macos-latest
    needs: [rt-safety-audit, changes]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.code_changed != 'false'
    timeout-minutes: 30

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure and build CLAP format
        run: |
          set -euo pipefail
          mkdir -p qa_output/format_clap

          cmake -S . -B build-format-clap \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLOCUSQ_ENABLE_CLAP=ON \
            -DLOCUSQ_CLAP_FETCH=ON \
            -DJUCE_DIR="${GITHUB_WORKSPACE}/JUCE" | tee qa_output/format_clap/cmake_configure.log

          cmake --build build-format-clap --config Release --target LocusQ_CLAP -j 4 | tee qa_output/format_clap/cmake_build.log

          CLAP_PATH="./build-format-clap/LocusQ_artefacts/Release/CLAP/LocusQ.clap"
          if [[ ! -d "${CLAP_PATH}" ]]; then
            CLAP_PATH="$(find build-format-clap -maxdepth 8 -name 'LocusQ.clap' -type d | head -n 1)"
          fi
          if [[ -z "${CLAP_PATH}" || ! -d "${CLAP_PATH}" ]]; then
            echo "Unable to locate LocusQ.clap artifact" >&2
            find build-format-clap -maxdepth 8 -name "LocusQ.clap" -type d || true
            exit 1
          fi

          find "${CLAP_PATH}" -maxdepth 4 | sort > qa_output/format_clap/artifact_manifest.txt
          printf "lane\tresult\tdetail\tartifact\ttimestamp_utc\n" > qa_output/format_clap/status.tsv
          printf "W2-C-CLAP\tPASS\tBuilt LocusQ_CLAP and located bundle\t%s\t%s\n" \
            "${CLAP_PATH}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> qa_output/format_clap/status.tsv

      - name: Upload CLAP format artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-format-clap
          path: |
            qa_output/format_clap/
            build-format-clap/LocusQ_artefacts/
            build-format-clap/CMakeCache.txt
          retention-days: 14

  qa-format-auv3:
    name: QA Format AUv3 (macOS)
    runs-on: macos-latest
    needs: [rt-safety-audit, changes]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.code_changed != 'false'
    timeout-minutes: 35

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure and build AUv3 format
        run: |
          set -euo pipefail
          mkdir -p qa_output/format_auv3

          cmake -S . -B build-format-auv3 \
            -G Xcode \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLOCUSQ_ENABLE_AUV3=ON \
            -DJUCE_DIR="${GITHUB_WORKSPACE}/JUCE" | tee qa_output/format_auv3/cmake_configure.log

          xcodebuild \
            -project build-format-auv3/LocusQ.xcodeproj \
            -scheme LocusQ_AUv3 \
            -configuration Release \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee qa_output/format_auv3/xcodebuild.log

          AUV3_PATH="./build-format-auv3/LocusQ_artefacts/Release/AUv3/LocusQ.appex"
          if [[ ! -d "${AUV3_PATH}" ]]; then
            AUV3_PATH="$(find build-format-auv3 -maxdepth 8 -name 'LocusQ.appex' -type d | head -n 1)"
          fi
          if [[ -z "${AUV3_PATH}" || ! -d "${AUV3_PATH}" ]]; then
            echo "Unable to locate LocusQ.appex artifact" >&2
            find build-format-auv3 -maxdepth 8 -name "LocusQ.appex" -type d || true
            exit 1
          fi

          ./scripts/qa-bl067-auv3-lifecycle-mac.sh \
            --contract-only \
            --out-dir qa_output/format_auv3/bl067_contract | tee qa_output/format_auv3/bl067_contract.log

          find "${AUV3_PATH}" -maxdepth 4 | sort > qa_output/format_auv3/artifact_manifest.txt
          printf "lane\tresult\tdetail\tartifact\ttimestamp_utc\n" > qa_output/format_auv3/status.tsv
          printf "W2-C-AUV3\tPASS\tBuilt LocusQ_AUv3, located appex, and passed BL-067 contract lane\t%s\t%s\n" \
            "${AUV3_PATH}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> qa_output/format_auv3/status.tsv

      - name: Upload AUv3 format artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-format-auv3
          path: |
            qa_output/format_auv3/
            build-format-auv3/LocusQ_artefacts/
            build-format-auv3/CMakeCache.txt
          retention-days: 14

  qa-critical:
    name: QA Critical (${{ matrix.os }})
    needs: [rt-safety-audit, changes]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.code_changed != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Checkout QA harness
        id: checkout-qa-harness
        uses: joshband/audio-dsp-qa-harness/.github/actions/checkout-qa-harness@master
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Configure QA build
        run: |
          cmake -S . -B build-qa \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_LOCUSQ_QA=ON \
            -DQA_HARNESS_DIR="${{ steps.checkout-qa-harness.outputs.harness-path }}" \
            -DJUCE_DIR="${GITHUB_WORKSPACE}/JUCE"

      - name: Build QA target
        run: cmake --build build-qa --target locusq_qa -j 4

      - name: Run critical QA suites + 4-channel matrix
        run: |
          set -euo pipefail
          mkdir -p qa_output

          LOCUSQ_QA_BIN="./build-qa/locusq_qa_artefacts/locusq_qa"
          if [ ! -x "${LOCUSQ_QA_BIN}" ]; then
            LOCUSQ_QA_BIN="./build-qa/locusq_qa_artefacts/Release/locusq_qa"
          fi
          if [ ! -x "${LOCUSQ_QA_BIN}" ]; then
            echo "Unable to find locusq_qa executable" >&2
            find build-qa -maxdepth 5 -name locusq_qa -type f || true
            exit 1
          fi

          # Existing core gates (2-channel baseline).
          "${LOCUSQ_QA_BIN}" qa/scenarios/locusq_smoke_suite.json | tee qa_output/ci_smoke_suite.log
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_contract_pack_suite.json | tee qa_output/ci_contract_pack_suite.log
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_phase_2_6_acceptance_suite.json | tee qa_output/ci_phase_2_6_acceptance_suite.log
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_phase_2_5_acceptance_suite.json | tee qa_output/ci_phase_2_5_regression_suite.log
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_phase_2_8_output_layout_mono_suite.json | tee qa_output/ci_phase_2_8_output_layout_mono_suite.log
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_phase_2_8_output_layout_stereo_suite.json | tee qa_output/ci_phase_2_8_output_layout_stereo_suite.log
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_phase_2_8_output_layout_quad_suite.json | tee qa_output/ci_phase_2_8_output_layout_quad_suite.log
          "${LOCUSQ_QA_BIN}" --spatial --sample-rate 48000 --block-size 512 qa/scenarios/locusq_phase_2_10b_renderer_cpu_trend_suite.json | tee qa_output/ci_phase_2_10b_renderer_cpu_trend_48k_512_ch2.log
          "${LOCUSQ_QA_BIN}" --spatial --sample-rate 48000 --block-size 512 --channels 4 qa/scenarios/locusq_phase_2_10b_renderer_cpu_trend_suite.json | tee qa_output/ci_phase_2_10b_renderer_cpu_trend_48k_512_ch4.log

          # New 4-channel regression lanes.
          "${LOCUSQ_QA_BIN}" --spatial qa/scenarios/locusq_renderer_spatial_output.json --channels 4 | tee qa_output/ci_renderer_spatial_output_quad4.log
          "${LOCUSQ_QA_BIN}" qa/scenarios/locusq_smoke_suite.json --channels 4 | tee qa_output/ci_smoke_suite_quad4.log

          # Cross-platform lifecycle probe in 2ch and 4ch.
          "${LOCUSQ_QA_BIN}" --spatial --sample-rate 96000 qa/scenarios/locusq_26_host_edge_roundtrip_multipass.json | tee qa_output/ci_phase_2_6_host_edge_96k_ch2.log
          "${LOCUSQ_QA_BIN}" --spatial --sample-rate 96000 --channels 4 qa/scenarios/locusq_26_host_edge_roundtrip_multipass.json | tee qa_output/ci_phase_2_6_host_edge_96k_ch4.log

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            for pair in "44100 256" "48000 512" "48000 1024" "96000 512"; do
              set -- ${pair}
              "${LOCUSQ_QA_BIN}" --spatial --sample-rate "$1" --block-size "$2" qa/scenarios/locusq_26_host_edge_roundtrip_multipass.json | tee "qa_output/ci_phase_2_6_host_edge_${1}_${2}_ch2.log"
              "${LOCUSQ_QA_BIN}" --spatial --sample-rate "$1" --block-size "$2" --channels 4 qa/scenarios/locusq_26_host_edge_roundtrip_multipass.json | tee "qa_output/ci_phase_2_6_host_edge_${1}_${2}_ch4.log"
            done

            "${LOCUSQ_QA_BIN}" --spatial --sample-rate 48000 --block-size 512 qa/scenarios/locusq_26_full_system_cpu_draft.json | tee qa_output/ci_phase_2_6_full_system_48k_512_ch2.log
            "${LOCUSQ_QA_BIN}" --spatial --sample-rate 48000 --block-size 512 --channels 4 qa/scenarios/locusq_26_full_system_cpu_draft.json | tee qa_output/ci_phase_2_6_full_system_48k_512_ch4.log
            "${LOCUSQ_QA_BIN}" --spatial --sample-rate 96000 --block-size 512 qa/scenarios/locusq_phase_2_10b_renderer_cpu_trend_suite.json | tee qa_output/ci_phase_2_10b_renderer_cpu_trend_96k_512_ch2.log
            "${LOCUSQ_QA_BIN}" --spatial --sample-rate 96000 --block-size 512 --channels 4 qa/scenarios/locusq_phase_2_10b_renderer_cpu_trend_suite.json | tee qa_output/ci_phase_2_10b_renderer_cpu_trend_96k_512_ch4.log
          fi

      - name: Verify QA result statuses
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          seen = 0
          for result in pathlib.Path("qa_output").rglob("result.json"):
              seen += 1
              try:
                  payload = json.loads(result.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append((str(result), f"PARSE_ERROR:{exc}"))
                  continue
              status = str(payload.get("status", "")).upper()
              if status in ("FAIL", "ERROR"):
                  bad.append((str(result), status))
          if seen == 0:
              print("No scenario result.json files found under qa_output.")
              sys.exit(1)
          if bad:
              print("Found failing QA scenario results:")
              for path, status in bad:
                  print(f"  {status}: {path}")
              sys.exit(1)
          print("All scenario result.json statuses are PASS/WARN/SKIP.")
          PY

      - name: Publish CI summary
        if: always()
        run: |
          bash audio-dsp-qa-harness/scripts/publish_ci_summary.sh qa_output/locusq_spatial/report/ci_summary.md || true
          bash audio-dsp-qa-harness/scripts/publish_ci_summary.sh qa_output/locusq_emitter/report/ci_summary.md || true

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-qa-critical-${{ matrix.os }}
          path: |
            qa_output/
            build-qa/locusq_qa_artefacts/
            build-qa/CMakeCache.txt
          retention-days: 14

  qa-bl029-reliability-gate:
    name: BL-029 Reliability Gate (macOS)
    runs-on: macos-latest
    needs: [rt-safety-audit, changes, qa-critical]
    # 90 minutes is too expensive to run on every PR push, so this is opt-in:
    # always on main/workflow_dispatch, otherwise only when a reviewer applies
    # the "needs-reliability-gate" label. `always()` overrides the default
    # needs-based skip so this can still run when qa-critical itself was
    # skipped (e.g. a labelled PR with no code changes) - it still requires
    # qa-critical to not have actively failed.
    if: |
      always() &&
      needs.rt-safety-audit.result == 'success' &&
      (needs.qa-critical.result == 'success' || needs.qa-critical.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'needs-reliability-gate'))
    timeout-minutes: 90

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run BL-029 reliability hard gate
        run: |
          set -euo pipefail
          mkdir -p qa_output/bl029_reliability_gate
          chmod +x ./scripts/qa-bl029-reliability-gate-mac.sh
          BL029_GATE_OUT_DIR="qa_output/bl029_reliability_gate" \
            ./scripts/qa-bl029-reliability-gate-mac.sh | tee qa_output/bl029_reliability_gate/ci_gate.log

      - name: Upload BL-029 reliability gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-bl029-reliability-gate
          path: qa_output/bl029_reliability_gate/
          retention-days: 14

  qa-pluginval-seeded-stress:
    name: QA Pluginval Seeded Stress (macOS)
    runs-on: macos-latest
    needs: qa-bl029-reliability-gate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 35

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Configure plugin build
        run: |
          cmake -S . -B build-pluginval \
            -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_DIR="${GITHUB_WORKSPACE}/JUCE"

      - name: Build VST3 target for pluginval stress
        run: cmake --build build-pluginval --target LocusQ_VST3 -j 4

      - name: Install pluginval (macOS release)
        run: |
          set -euo pipefail
          mkdir -p _tools/pluginval-ci
          downloaded=0
          for url in \
            "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" \
            "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_mac.zip"; do
            if curl -L --fail -o /tmp/pluginval_macOS.zip "${url}"; then
              downloaded=1
              break
            fi
          done
          if [[ "${downloaded}" -ne 1 ]]; then
            echo "Failed to download pluginval macOS release archive" >&2
            exit 1
          fi
          unzip -q -o /tmp/pluginval_macOS.zip -d _tools/pluginval-ci

          PLUGINVAL_BIN="$(find _tools/pluginval-ci -type f -path '*pluginval.app/Contents/MacOS/pluginval' | head -n 1)"
          if [[ -z "${PLUGINVAL_BIN}" ]]; then
            echo "pluginval binary not found after extraction" >&2
            find _tools/pluginval-ci -maxdepth 6 -type f | sed -n '1,120p'
            exit 1
          fi

          echo "PLUGINVAL_BIN=${PLUGINVAL_BIN}" >> "${GITHUB_ENV}"

      - name: Run seeded pluginval stress
        run: |
          set -euo pipefail
          mkdir -p qa_output/pluginval_seeded_stress

          PLUGIN_PATH="./build-pluginval/LocusQ_artefacts/VST3/LocusQ.vst3"
          if [[ ! -d "${PLUGIN_PATH}" ]]; then
            PLUGIN_PATH="./build-pluginval/LocusQ_artefacts/Release/VST3/LocusQ.vst3"
          fi
          if [[ ! -d "${PLUGIN_PATH}" ]]; then
            echo "Unable to find built LocusQ.vst3 for pluginval" >&2
            find build-pluginval -maxdepth 6 -name LocusQ.vst3 -type d || true
            exit 1
          fi

          STATUS_TSV="qa_output/pluginval_seeded_stress/status.tsv"
          printf "seed\texit_code\tlog\n" > "${STATUS_TSV}"

          failures=0
          for seed in 0x2a331c6 0x2a331c7 0x2a331c8 0x2a331c9 0x2a331ca; do
            log_file="qa_output/pluginval_seeded_stress/pluginval_seed_${seed}.log"
            set +e
            "${PLUGINVAL_BIN}" \
              --strictness-level 5 \
              --validate-in-process \
              --skip-gui-tests \
              --random-seed "${seed}" \
              "${PLUGIN_PATH}" > "${log_file}" 2>&1
            exit_code=$?
            set -e

            printf "%s\t%s\t%s\n" "${seed}" "${exit_code}" "${log_file}" | tee -a "${STATUS_TSV}"
            if [[ "${exit_code}" -ne 0 ]]; then
              failures=$((failures + 1))
            fi
          done

          if [[ "${failures}" -ne 0 ]]; then
            echo "Seeded pluginval stress failed for ${failures} seed(s)." >&2
            exit 1
          fi

      - name: Upload pluginval seeded stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-pluginval-seeded-stress
          path: |
            qa_output/pluginval_seeded_stress/
            build-pluginval/LocusQ_artefacts/
            build-pluginval/CMakeCache.txt
          retention-days: 21

  qa-perf-trend:
    name: QA Perf Trend (Ubuntu)
    runs-on: ubuntu-latest
    needs: rt-safety-audit
    if: github.event_name != 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout LocusQ
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE

      - name: Checkout QA harness
        id: checkout-qa-harness
        uses: joshband/audio-dsp-qa-harness/.github/actions/checkout-qa-harness@master
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Configure QA build
        run: |
          cmake -S . -B build-qa \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_LOCUSQ_QA=ON \
            -DQA_HARNESS_DIR="${{ steps.checkout-qa-harness.outputs.harness-path }}" \
            -DJUCE_DIR="${GITHUB_WORKSPACE}/JUCE"

      - name: Build QA target
        run: cmake --build build-qa --target locusq_qa -j 4

      - name: Run performance trend scenarios
        run: |
          set -euo pipefail
          mkdir -p qa_output

          LOCUSQ_QA_BIN="./build-qa/locusq_qa_artefacts/locusq_qa"
          if [ ! -x "${LOCUSQ_QA_BIN}" ]; then
            LOCUSQ_QA_BIN="./build-qa/locusq_qa_artefacts/Release/locusq_qa"
          fi
          if [ ! -x "${LOCUSQ_QA_BIN}" ]; then
            echo "Unable to find locusq_qa executable" >&2
            find build-qa -maxdepth 5 -name locusq_qa -type f || true
            exit 1
          fi

          "${LOCUSQ_QA_BIN}" --spatial --profile --profile-iterations 2000 qa/scenarios/locusq_26_full_system_cpu_draft.json | tee qa_output/ci_perf_phase_2_6_full_system.log
          "${LOCUSQ_QA_BIN}" --spatial --profile --profile-iterations 2000 qa/scenarios/locusq_25_cpu_budget_draft.json | tee qa_output/ci_perf_phase_2_5_cpu.log

      - name: Publish CI summary
        if: always()
        run: |
          bash audio-dsp-qa-harness/scripts/publish_ci_summary.sh qa_output/locusq_spatial/report/ci_summary.md || true

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locusq-qa-perf-trend
          path: |
            qa_output/
            build-qa/locusq_qa_artefacts/
          retention-days: 14
