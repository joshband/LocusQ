<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Render Trust Ladder — Requested vs Active vs Fallback</title>
  <desc id="desc">Visual showing how requested, active, and fallback render paths should be communicated in the plugin RENDERER authority card.</desc>

  <rect width="960" height="580" rx="20" fill="#08090D"/>
  <text x="480" y="36" fill="#D4A847" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">RENDER TRUST LADDER — REQUESTED vs ACTIVE vs FALLBACK</text>

  <!-- Column headers -->
  <text x="170" y="68" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">SCENARIO</text>
  <text x="420" y="68" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">AUTHORITY CARD CONTENT</text>
  <text x="740" y="68" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">PREVIOUS REVIEW CALL</text>

  <line x1="24" y1="78" x2="936" y2="78" stroke="#1E2938" stroke-width="1"/>

  <!-- Row 1: Fully live -->
  <rect x="24" y="86" width="912" height="72" rx="14" fill="#0F1A10" stroke="#67E2A5"/>
  <text x="170" y="114" fill="#67E2A5" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">Fully Live</text>
  <text x="170" y="134" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Head tracking + personalized HRTF</text>
  <text x="170" y="150" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Steam available, profile matched</text>

  <text x="290" y="122" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Requested:</text>
  <text x="380" y="122" fill="#D4A847" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Personalized Binaural</text>
  <text x="290" y="140" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Active:</text>
  <text x="380" y="140" fill="#67E2A5" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Personalized Binaural ✓</text>
  <text x="290" y="152" fill="#6E7A8E" font-size="9" font-family="Arial, Helvetica, sans-serif">Why changed: n/a</text>
  <text x="290" y="162" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Owner:</text>
  <text x="380" y="162" fill="#A6B1C2" font-size="12" font-family="Arial, Helvetica, sans-serif">Companion Profile</text>

  <text x="740" y="119" fill="#67E2A5" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Agree — show all 4 fields</text>
  <text x="740" y="137" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Requested=Active means no explanation</text>
  <text x="740" y="152" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">needed but still show owner</text>

  <!-- Row 2: Profile degraded -->
  <rect x="24" y="170" width="912" height="80" rx="14" fill="#1B1608" stroke="#FFB86B"/>
  <text x="170" y="198" fill="#FFB86B" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">Profile Degraded</text>
  <text x="170" y="218" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Head tracking live, but HRTF</text>
  <text x="170" y="234" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">fell back to generic</text>

  <text x="290" y="198" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Requested:</text>
  <text x="380" y="198" fill="#D4A847" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Personalized Binaural</text>
  <text x="290" y="216" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Active:</text>
  <text x="380" y="216" fill="#FFB86B" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Generic HRTF</text>
  <text x="290" y="234" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Why changed:</text>
  <text x="380" y="234" fill="#EEF4FB" font-size="12" font-family="Arial, Helvetica, sans-serif">Profile match confidence too low</text>
  <text x="290" y="246" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Owner:</text>
  <text x="380" y="246" fill="#A6B1C2" font-size="12" font-family="Arial, Helvetica, sans-serif">System Fallback</text>

  <text x="740" y="198" fill="#67E2A5" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Agree — show WHY clearly</text>
  <text x="740" y="216" fill="#FFB86B" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">★ "Why changed" must be plain language</text>
  <text x="740" y="231" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">not an internal ID or state name</text>
  <text x="740" y="246" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">e.g. NOT "fallback_stage_2"</text>

  <!-- Row 3: Steam unavailable -->
  <rect x="24" y="262" width="912" height="80" rx="14" fill="#1A0E10" stroke="#FF7A6E"/>
  <text x="170" y="290" fill="#FF7A6E" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">Steam Unavailable</text>
  <text x="170" y="310" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Spatial engine not loaded</text>
  <text x="170" y="326" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">or failed to initialize</text>

  <text x="290" y="290" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Requested:</text>
  <text x="380" y="290" fill="#D4A847" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Personalized Binaural</text>
  <text x="290" y="308" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Active:</text>
  <text x="380" y="308" fill="#FF7A6E" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Stereo Downmix</text>
  <text x="290" y="326" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Why changed:</text>
  <text x="380" y="326" fill="#EEF4FB" font-size="12" font-family="Arial, Helvetica, sans-serif">Spatial engine unavailable on this host</text>
  <text x="290" y="338" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Owner:</text>
  <text x="380" y="338" fill="#A6B1C2" font-size="12" font-family="Arial, Helvetica, sans-serif">Host Constraint</text>

  <text x="740" y="290" fill="#67E2A5" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Agree — Steam is diagnostic</text>
  <text x="740" y="308" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">context, not the headline</text>
  <text x="740" y="323" fill="#FFB86B" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">★ "Host Constraint" is better than</text>
  <text x="740" y="338" fill="#FFB86B" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">"steam_unavailable" internal label</text>

  <!-- Row 4: Companion lost -->
  <rect x="24" y="354" width="912" height="72" rx="14" fill="#1A0A12" stroke="#FF7A6E"/>
  <text x="170" y="382" fill="#FF7A6E" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">Companion Lost</text>
  <text x="170" y="402" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Pose stream timed out</text>
  <text x="170" y="418" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">or stale</text>

  <text x="290" y="382" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Requested:</text>
  <text x="380" y="382" fill="#D4A847" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Head-Tracked Binaural</text>
  <text x="290" y="400" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Active:</text>
  <text x="380" y="400" fill="#FF7A6E" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Static Binaural (pose stale)</text>
  <text x="290" y="418" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Why changed:</text>
  <text x="380" y="418" fill="#EEF4FB" font-size="12" font-family="Arial, Helvetica, sans-serif">No pose received for 2.4 seconds</text>

  <text x="740" y="382" fill="#FFB86B" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">★ Not in previous review</text>
  <text x="740" y="400" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Stale pose duration should be</text>
  <text x="740" y="415" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">visible in Why, not just Lab</text>

  <!-- Row 5: AUv3 limited -->
  <rect x="24" y="438" width="912" height="80" rx="14" fill="#111924" stroke="#59D8FF" stroke-dasharray="6 5"/>
  <text x="170" y="466" fill="#59D8FF" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">AUv3 Extension</text>
  <text x="170" y="486" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Capability-limited context</text>
  <text x="170" y="502" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Some features unavailable</text>

  <text x="290" y="466" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Requested:</text>
  <text x="380" y="466" fill="#D4A847" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Full Personalized Binaural</text>
  <text x="290" y="484" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Active:</text>
  <text x="380" y="484" fill="#FFB86B" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">Generic HRTF (limited)</text>
  <text x="290" y="502" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Why changed:</text>
  <text x="380" y="502" fill="#EEF4FB" font-size="12" font-family="Arial, Helvetica, sans-serif">Limited in AUv3 — file access restricted</text>
  <text x="290" y="518" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Owner:</text>
  <text x="380" y="518" fill="#A6B1C2" font-size="12" font-family="Arial, Helvetica, sans-serif">Format Constraint</text>

  <text x="740" y="466" fill="#67E2A5" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Agree with prior review</text>
  <text x="740" y="484" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Same authority card, different</text>
  <text x="740" y="499" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Why+Owner text — no separate UI</text>

  <!-- Footer rule -->
  <rect x="24" y="534" width="912" height="36" rx="12" fill="#131B24" stroke="#1E2938"/>
  <text x="480" y="557" fill="#D4A847" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle">RULE: Requested and Active must always appear together. Why Changed must be plain language, never an internal identifier.</text>
</svg>
