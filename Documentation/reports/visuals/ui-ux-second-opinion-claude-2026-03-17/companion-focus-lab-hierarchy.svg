<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Companion Focus vs Lab Hierarchy</title>
  <desc id="desc">Step-by-step companion Focus flow with Lab boundary callout and synthetic mode warning.</desc>

  <rect width="900" height="720" rx="20" fill="#08090D"/>
  <text x="450" y="38" fill="#59D8FF" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">COMPANION — FOCUS vs LAB HIERARCHY</text>

  <!-- Companion window -->
  <rect x="40" y="58" width="480" height="628" rx="18" fill="#0E1218" stroke="#2D3745"/>

  <!-- Title bar -->
  <rect x="40" y="58" width="480" height="46" rx="18" fill="#131B24"/>
  <rect x="40" y="86" width="480" height="18" fill="#131B24"/>
  <text x="68" y="88" fill="#EEF4FB" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="700">Head-Tracking Companion</text>
  <rect x="418" y="66" width="78" height="24" rx="12" fill="#1A2F3A" stroke="#59D8FF"/>
  <text x="457" y="82" fill="#59D8FF" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle">FOCUS</text>

  <!-- Step 1 — Device availability -->
  <rect x="60" y="120" width="440" height="64" rx="14" fill="#171D26" stroke="#2D3745"/>
  <rect x="60" y="120" width="4" height="64" rx="2" fill="#67E2A5"/>
  <text x="80" y="143" fill="#67E2A5" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">STEP 1 — DEVICE</text>
  <text x="80" y="164" fill="#EEF4FB" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="600">AirPods Pro — Supported · Connected</text>

  <!-- Step 2 — Readiness funnel -->
  <rect x="60" y="196" width="440" height="80" rx="14" fill="#171D26" stroke="#2D3745"/>
  <rect x="60" y="196" width="4" height="80" rx="2" fill="#67E2A5"/>
  <text x="80" y="218" fill="#67E2A5" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">STEP 2 — READINESS</text>
  <circle cx="90" cy="248" r="7" fill="#67E2A5"/>
  <text x="106" y="252" fill="#EEF4FB" font-size="12" font-family="Arial, Helvetica, sans-serif">Motion ready</text>
  <circle cx="200" cy="248" r="7" fill="#67E2A5"/>
  <text x="216" y="252" fill="#EEF4FB" font-size="12" font-family="Arial, Helvetica, sans-serif">Synced</text>
  <circle cx="290" cy="248" r="7" fill="#59D8FF"/>
  <text x="306" y="252" fill="#59D8FF" font-size="12" font-family="Arial, Helvetica, sans-serif">Sending</text>
  <circle cx="390" cy="248" r="7" fill="#6E7A8E"/>
  <text x="406" y="252" fill="#6E7A8E" font-size="12" font-family="Arial, Helvetica, sans-serif">Plugin ack</text>
  <line x1="98" y1="248" x2="192" y2="248" stroke="#3D4D5A" stroke-width="1"/>
  <line x1="208" y1="248" x2="282" y2="248" stroke="#3D4D5A" stroke-width="1"/>
  <line x1="298" y1="248" x2="382" y2="248" stroke="#3D4D5A" stroke-width="1"/>

  <!-- Step 3 — Center / Sync (prominent) -->
  <rect x="60" y="288" width="440" height="64" rx="14" fill="#171D26" stroke="#2D3745"/>
  <rect x="60" y="288" width="4" height="64" rx="2" fill="#D4A847"/>
  <text x="80" y="310" fill="#D4A847" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">STEP 3 — CENTER</text>
  <rect x="80" y="320" width="126" height="24" rx="8" fill="#1E2C1A" stroke="#67E2A5"/>
  <text x="143" y="336" fill="#67E2A5" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle">Center / Sync</text>
  <text x="220" y="336" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif">Last centered: 00:02:14 ago</text>

  <!-- Synthetic mode warning (NEW) -->
  <rect x="60" y="364" width="440" height="52" rx="14" fill="#1B1208" stroke="#FFB86B"/>
  <rect x="60" y="364" width="4" height="52" rx="2" fill="#FFB86B"/>
  <text x="80" y="384" fill="#FFB86B" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">★ SYNTHETIC MODE ACTIVE</text>
  <text x="80" y="404" fill="#A6B1C2" font-size="12" font-family="Arial, Helvetica, sans-serif">Motion data is simulated — not from a real device.</text>

  <!-- Step 4 — Active profile -->
  <rect x="60" y="428" width="440" height="64" rx="14" fill="#171D26" stroke="#2D3745"/>
  <rect x="60" y="428" width="4" height="64" rx="2" fill="#D4A847"/>
  <text x="80" y="450" fill="#D4A847" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">STEP 4 — PROFILE</text>
  <text x="80" y="472" fill="#EEF4FB" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="600">Active: Personalized (Match 94%)</text>

  <!-- Step 5 — Capture tray -->
  <rect x="60" y="504" width="440" height="64" rx="14" fill="#171D26" stroke="#2D3745"/>
  <rect x="60" y="504" width="4" height="64" rx="2" fill="#D4A847"/>
  <text x="80" y="526" fill="#D4A847" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">STEP 5 — CAPTURE TRAY (IF NEEDED)</text>
  <rect x="80" y="535" width="88" height="22" rx="8" fill="#1B2A1C" stroke="#67E2A5"/>
  <text x="124" y="550" fill="#67E2A5" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Left Ear ✓</text>
  <rect x="178" y="535" width="96" height="22" rx="8" fill="#1B2A1C" stroke="#67E2A5"/>
  <text x="226" y="550" fill="#67E2A5" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Right Ear ✓</text>
  <rect x="284" y="535" width="102" height="22" rx="8" fill="#171D26" stroke="#6E7A8E" stroke-dasharray="4 3"/>
  <text x="335" y="550" fill="#6E7A8E" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Front View</text>

  <!-- Lab toggle -->
  <rect x="60" y="580" width="440" height="86" rx="14" fill="#0C1018" stroke="#59D8FF" stroke-dasharray="6 5"/>
  <rect x="60" y="580" width="4" height="86" rx="2" fill="#59D8FF"/>
  <text x="80" y="602" fill="#59D8FF" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">LAB (opt-in)</text>
  <text x="80" y="624" fill="#6E7A8E" font-size="12" font-family="Arial, Helvetica, sans-serif">Quaternion · Packet age · Axis sweep</text>
  <text x="80" y="644" fill="#6E7A8E" font-size="12" font-family="Arial, Helvetica, sans-serif">Matcher scores · Jitter · Interval</text>
  <rect x="418" y="624" width="62" height="24" rx="12" fill="#111924" stroke="#59D8FF"/>
  <text x="449" y="640" fill="#59D8FF" font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="600" letter-spacing="0.8" text-anchor="middle">Open Lab</text>

  <!-- Annotation callouts right side -->
  <rect x="560" y="58" width="306" height="628" rx="18" fill="#0A0D12" stroke="#1E2938"/>
  <text x="713" y="90" fill="#FFB86B" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">SECOND-OPINION NOTES</text>

  <!-- Annotations -->
  <line x1="500" y1="152" x2="580" y2="152" stroke="#3D4D5A" stroke-dasharray="4 3"/>
  <text x="590" y="148" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="600">Match prev review ✓</text>
  <text x="590" y="163" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">Device first, correct</text>

  <line x1="500" y1="236" x2="580" y2="220" stroke="#3D4D5A" stroke-dasharray="4 3"/>
  <text x="590" y="216" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="600">Prev review: ✓ good</text>
  <text x="590" y="231" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">Add plugin ack as 4th step</text>

  <line x1="500" y1="320" x2="580" y2="310" stroke="#3D4D5A" stroke-dasharray="4 3"/>
  <text x="590" y="306" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="600">Axis flip: Focus not Lab</text>
  <text x="590" y="321" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">First-run problem, not expert</text>

  <line x1="500" y1="390" x2="580" y2="390" stroke="#FFB86B" stroke-dasharray="4 3"/>
  <text x="590" y="386" fill="#FFB86B" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="700">★ MISSED IN PRIOR REVIEW</text>
  <text x="590" y="401" fill="#A6B1C2" font-size="10" font-family="Arial, Helvetica, sans-serif">Synthetic mode must be visible</text>
  <text x="590" y="415" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">Operator must know it's fake</text>

  <line x1="500" y1="460" x2="580" y2="460" stroke="#3D4D5A" stroke-dasharray="4 3"/>
  <text x="590" y="456" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="600">Match score visible here</text>
  <text x="590" y="471" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">Not just "personalized" label</text>

  <line x1="500" y1="536" x2="580" y2="536" stroke="#3D4D5A" stroke-dasharray="4 3"/>
  <text x="590" y="532" fill="#A6B1C2" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="600">Tile design: agree</text>
  <text x="590" y="547" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">Privacy note near apply button</text>

  <line x1="500" y1="623" x2="580" y2="623" stroke="#59D8FF" stroke-dasharray="4 3"/>
  <text x="590" y="619" fill="#59D8FF" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="600">Lab: strongly agree</text>
  <text x="590" y="634" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">Keep axis flip here too</text>
  <text x="590" y="648" fill="#6E7A8E" font-size="10" font-family="Arial, Helvetica, sans-serif">selftest mode: CI only, no UI</text>
</svg>
